    html {

    body {

      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {

    .logo span {
      color: #f4c542;

    nav a {

    .hero {

    }

    }

    .hero p {

      margin-bottom: 30px;
      color: #e5e5e5;
    }

    .btn {
      display: inline-block;
      padding: 15px 28px;
      background: #f4c542;
      color: #123524;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      margin-right: 10px;
    }

    .btn-outline {
      background: transparent;
      color: white;
      border: 2px solid white;
    }

    /* Sections */
    section {
      padding: 70px 8%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 36px;
      color: #123524;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #666;
    }
